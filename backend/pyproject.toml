[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-messenger-backend"
version = "0.1.0"
description = "Backend for Realtime Messenger"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "aiosqlite==0.21.0",
  "asyncpg==0.32.0",
  "email-validator==2.3.0",
  "fastapi==0.143.0",
  "PyJWT==2.15.1",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "sqlalchemy[asyncio]==2.1.4",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
