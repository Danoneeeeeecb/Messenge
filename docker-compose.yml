services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Realtime Messenger}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-20}
      MESSAGE_MAX_LENGTH: ${MESSAGE_MAX_LENGTH:-10000}
      MESSAGE_RATE_LIMIT_COUNT: ${MESSAGE_RATE_LIMIT_COUNT:-10}
      MESSAGE_RATE_LIMIT_WINDOW_SECONDS: ${MESSAGE_RATE_LIMIT_WINDOW_SECONDS:-10}
      WEBSOCKET_MAX_MESSAGE_BYTES: ${WEBSOCKET_MAX_MESSAGE_BYTES:-16384}
      MAX_WEBSOCKET_CONNECTIONS_PER_USER: ${MAX_WEBSOCKET_CONNECTIONS_PER_USER:-5}
      USER_SEARCH_RATE_LIMIT_COUNT: ${USER_SEARCH_RATE_LIMIT_COUNT:-30}
      USER_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${USER_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size $${WEBSOCKET_MAX_MESSAGE_BYTES:-16384}"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000\" + os.getenv(\"API_V1_PREFIX\", \"/api/v1\") + \"/health/ready\", timeout=2)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
